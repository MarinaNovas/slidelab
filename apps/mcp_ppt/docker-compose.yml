services:
  api:
    container_name: mcp_ppt_api
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "8000"
    volumes:
      - ./exports:/app/exports
      - ./media:/app/media

  mcp:
    container_name: mcp_ppt_mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp
    expose:
      - "8001"
    volumes:
      - ./exports:/app/exports
      - ./media:/app/media

  nginx:
    container_name: mcp_ppt_nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - mcp