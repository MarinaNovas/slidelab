services:
  api:
    container_name: mcp_ppt_api
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports

  mcp:
    container_name: mcp_ppt_mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
    volumes:
      - ./exports:/app/exports