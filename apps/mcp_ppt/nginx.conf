server {
    listen 80;
    server_name olega-mcp.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name olega-mcp.ru;
    ssl_certificate /etc/letsencrypt/live/olega-mcp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olega-mcp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Cert
    location /exports/ {
        proxy_pass http://api:8000/exports/;

    location /mcp {
        proxy_pass http://mcp:8001/mcp;
        proxy_http_version 1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_f
        proxy_buffering off;
        proxy_cache off;

    location / {
        proxy_pass http://api:8000/;

}